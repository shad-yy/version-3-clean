<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!--
    Sightline — the aperture mark. design/sightline/Sightline.dc.html §1d, option ii.
    Two brackets and a point: a sightline narrowed to one fact.

    Knocked out on amber, which is the design's own favicon treatment: at 16px a dark
    mark on a dark tab strip disappears, so the ground carries the colour instead.
    Geometry is the optical variant (heavier stroke, pulled-in brackets) because the
    24px drawing thins away to nothing at this size.
  -->
  <rect width="32" height="32" rx="7" fill="#f0a63c"/>
  <g transform="translate(4 4) scale(1)"
     fill="none" stroke="#0b0d11" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 4.5 4 12l4.5 7.5"/>
    <path d="M15.5 4.5 20 12l-4.5 7.5"/>
    <circle cx="12" cy="12" r="2.8" fill="#0b0d11" stroke="none"/>
  </g>
</svg>
